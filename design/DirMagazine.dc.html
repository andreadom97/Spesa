<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #C4441F; } a:hover { color: #993417; }
    * { box-sizing: border-box; }
    button { font-family: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
    .sc::-webkit-scrollbar { width: 0; }
  </style>
</helmet>
<div style="width: 393px; height: 852px; display: flex; flex-direction: column; overflow: hidden; background: #F0EEE9;">

  <div style="padding: 26px 18px 0;">
    <div style="display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid #101214;">
      <div style="font-size: 38px; font-weight: 600; letter-spacing: -0.042em; line-height: 0.94; color: #101214;">Spesa<br>settimanale</div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.11em; color: #7A756B;">
        <span style="color: #C4441F; font-weight: 700;">{{progressLabel}}</span>
        <span>31.08 — 06.09</span>
        <span>OFFLINE · 3</span>
      </div>
    </div>
  </div>

  <div class="sc" style="flex: 1; overflow-y: auto; padding: 16px 18px 20px;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div style="margin-bottom: 24px;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
          <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; color: #C4441F;">{{sec.idx}}</span>
          <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; color: #101214;">{{sec.rep}}</span>
          <span style="flex: 1; height: 1px; background: rgba(16,18,20,0.16);"></span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px;">
          <sc-for list="{{sec.items}}" as="item" hint-placeholder-count="3">
            <button onClick="{{item.toggle}}" style="{{item.tileStyle}}">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
                <div style="{{item.nameStyle}}">{{item.nome}}</div>
                <div style="{{item.dotStyle}}">
                  <sc-if value="{{item.done}}" hint-placeholder-val="{{true}}">
                    <svg width="12" height="12" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.5 L8.2 14 L15.5 6.4" stroke="#F0EEE9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </sc-if>
                </div>
              </div>
              <div style="display: flex; align-items: baseline; gap: 7px; margin-top: auto;">
                <span style="{{item.confStyle}}">{{item.conf}}</span>
                <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.05em; color: #A19B90;">{{item.qty}}</span>
              </div>
              <sc-if value="{{item.showSub}}" hint-placeholder-val="{{true}}">
                <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.03em; color: #B3ACA0; margin-top: 3px;">{{item.sub}}</div>
              </sc-if>
            </button>
          </sc-for>
        </div>
        <sc-for list="{{sec.controls}}" as="ctl" hint-placeholder-count="1">
          <div style="margin-top: 9px; padding: 14px 15px; background: #101214; display: flex; align-items: center; gap: 12px;">
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: #F0EEE9;">{{ctl.nome}}</div>
              <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; color: #7A756B; margin-top: 4px;">{{ctl.hint}}</div>
            </div>
            <div style="display: flex; gap: 7px;">
              <button onClick="{{ctl.yes}}" style="{{ctl.yesStyle}}">SÌ</button>
              <button onClick="{{ctl.no}}" style="{{ctl.noStyle}}">NO</button>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="padding: 13px 18px 20px; border-top: 1px solid #101214; display: flex; gap: 22px; align-items: center;">
    <button onClick="{{goBase}}" style="{{baseTabStyle}}">BASE<span style="opacity: 0.5;"> / {{baseCount}}</span></button>
    <button onClick="{{goTopup}}" style="{{topupTabStyle}}">TOP-UP<span style="opacity: 0.5;"> / {{topupCount}}</span></button>
    <span style="flex: 1;"></span>
    <div style="width: 54px; height: 3px; background: rgba(16,18,20,0.14);"><div style="{{progressBar}}"></div></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'base', done: { tonno: true, ceci: true }, ctl: {} }; }
  data() {
    return {
      base: [
        { rep: 'PASTA E CEREALI', items: [
          { id: 'riso', nome: 'Riso Carnaroli', conf: '1 conf', qty: '1000 g', sub: 'in casa 0 g', big: true },
          { id: 'avena', nome: "Fiocchi d'avena", conf: '1 conf', qty: '500 g', sub: 'in casa 90 g' },
          { id: 'pasta', nome: 'Pasta integrale', conf: '2 conf', qty: '1000 g', sub: '' }
        ], controls: [] },
        { rep: 'SCATOLAME', items: [
          { id: 'tonno', nome: 'Tonno al naturale', conf: '3 conf', qty: '240 g', sub: '' },
          { id: 'ceci', nome: 'Ceci lessati', conf: '2 conf', qty: '800 g', sub: '' },
          { id: 'passata', nome: 'Passata di pomodoro', conf: '1 conf', qty: '700 g', sub: '', big: true }
        ], controls: [ { id: 'olio', nome: 'Olio: ne hai ancora?', hint: '54 GIORNI DALL ULTIMO ACQUISTO' } ] },
        { rep: 'BEVANDE', items: [
          { id: 'caffe', nome: 'Caffè macinato', conf: '1 conf', qty: '250 g', sub: '', big: true }
        ], controls: [] }
      ],
      topup: [
        { rep: 'LATTICINI E UOVA', items: [
          { id: 'yogurt', nome: 'Yogurt greco', conf: '2 conf', qty: '1000 g', sub: 'in casa 50 g', big: true },
          { id: 'uova', nome: 'Uova', conf: '6 pz', qty: '6 pz', sub: '' }
        ], controls: [] },
        { rep: 'MACELLERIA', items: [
          { id: 'pollo', nome: 'Petto di pollo', conf: '1 conf', qty: '700 g', sub: 'in casa 0 g', big: true },
          { id: 'salmone', nome: 'Salmone', conf: '2 conf', qty: '300 g', sub: '' }
        ], controls: [] },
        { rep: 'ORTOFRUTTA', items: [
          { id: 'spinaci', nome: 'Spinaci', conf: '2 conf', qty: '400 g', sub: '' },
          { id: 'mele', nome: 'Mele', conf: '6 pz', qty: '6 pz', sub: '' }
        ], controls: [] }
      ]
    };
  }
  countOf(secs) { var n = 0; for (var i = 0; i < secs.length; i++) { n += secs[i].items.length; } return n; }
  renderVals() {
    var self = this;
    var d = this.data();
    var secs = (this.state.tab === 'base') ? d.base : d.topup;
    var total = 0, done = 0, si = 0;
    var sections = secs.map(function (s) {
      si += 1;
      var items = s.items.map(function (it) {
        var k = !!self.state.done[it.id];
        total += 1; if (k) { done += 1; }
        var span = it.big ? 'grid-column: span 2; min-height: 96px;' : 'min-height: 118px;';
        return {
          nome: it.nome, conf: it.conf, qty: it.qty, sub: it.sub, done: k, showSub: !!it.sub && !k,
          tileStyle: 'display: flex; flex-direction: column; padding: 13px 14px 12px; ' + span
            + ' border: 1px solid ' + (k ? 'rgba(196,68,31,0.30)' : 'rgba(16,18,20,0.13)') + ';'
            + ' background: ' + (k ? 'rgba(196,68,31,0.07)' : '#FAF8F4') + ';',
          nameStyle: 'font-size: ' + (it.big ? '25px' : '17px') + '; font-weight: 600; letter-spacing: -0.03em; line-height: 1.08; color: ' + (k ? '#B3ACA0' : '#101214') + ';' + (k ? ' text-decoration: line-through; text-decoration-thickness: 1.5px;' : ''),
          dotStyle: 'width: 22px; height: 22px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 1.5px solid ' + (k ? '#C4441F' : 'rgba(16,18,20,0.22)') + '; background: ' + (k ? '#C4441F' : 'transparent') + ';',
          confStyle: "font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: " + (k ? '#B3ACA0' : '#C4441F') + ';',
          toggle: function () { var n = Object.assign({}, self.state.done); if (n[it.id]) { delete n[it.id]; } else { n[it.id] = true; } self.setState({ done: n }); }
        };
      });
      var controls = (s.controls || []).map(function (c) {
        var a = self.state.ctl[c.id] || null;
        var b = "min-width: 52px; height: 46px; padding: 0 13px; text-align: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em; border: 1px solid ";
        return {
          nome: c.nome, hint: c.hint,
          yesStyle: b + (a === 'si' ? '#C4441F; background: #C4441F; color: #F0EEE9;' : 'rgba(240,238,233,0.32); background: transparent; color: #F0EEE9;'),
          noStyle: b + (a === 'no' ? '#C4441F; background: #C4441F; color: #F0EEE9;' : 'rgba(240,238,233,0.32); background: transparent; color: #F0EEE9;'),
          yes: function () { var x = Object.assign({}, self.state.ctl); x[c.id] = 'si'; self.setState({ ctl: x }); },
          no: function () { var x = Object.assign({}, self.state.ctl); x[c.id] = 'no'; self.setState({ ctl: x }); }
        };
      });
      return { rep: s.rep, idx: si < 10 ? '0' + si : '' + si, items: items, controls: controls };
    });
    var pct = total ? Math.round((done / total) * 100) : 0;
    var tOn = "font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #101214; border-bottom: 2px solid #C4441F; padding: 8px 0;";
    var tOff = "font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; color: #A19B90; border-bottom: 2px solid transparent; padding: 8px 0;";
    return {
      sections: sections,
      baseCount: this.countOf(d.base), topupCount: this.countOf(d.topup),
      progressLabel: done + '/' + total + ' PRESI',
      progressBar: 'height: 100%; width: ' + pct + '%; background: #C4441F;',
      baseTabStyle: this.state.tab === 'base' ? tOn : tOff,
      topupTabStyle: this.state.tab === 'topup' ? tOn : tOff,
      goBase: function () { self.setState({ tab: 'base' }); },
      goTopup: function () { self.setState({ tab: 'topup' }); }
    };
  }
}
</script>
</body>
</html>
