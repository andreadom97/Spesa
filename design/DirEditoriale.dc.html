<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #14130F; } a:hover { color: #6E6A5E; }
    * { box-sizing: border-box; }
    button { font-family: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
    .sc::-webkit-scrollbar { width: 0; }
  </style>
</helmet>
<div style="width: 393px; height: 852px; display: flex; flex-direction: column; overflow: hidden; background: #F2F1EE;">

  <div style="padding: 30px 20px 18px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #14130F; padding-bottom: 14px;">
      <div style="font-size: 44px; font-weight: 500; letter-spacing: -0.045em; line-height: 0.92; color: #14130F;">Spesa</div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
        <span style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: #14130F;">31 AGO — 6 SET</span>
        <span style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.16em; color: #9B9689;">OFFLINE · 3</span>
      </div>
    </div>
  </div>

  <div class="sc" style="flex: 1; overflow-y: auto; padding: 0 20px 24px;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div style="margin-bottom: 26px;">
        <div style="display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px;">
          <span style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 0.17em; color: #14130F; white-space: nowrap;">{{sec.rep}}</span>
          <span style="flex: 1; height: 1px; background: #C9C5B9;"></span>
          <span style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 10.5px; font-weight: 500; letter-spacing: 0.12em; color: #9B9689;">{{sec.n}}</span>
        </div>

        <sc-for list="{{sec.items}}" as="item" hint-placeholder-count="3">
          <button onClick="{{item.toggle}}" style="width: 100%; display: flex; align-items: center; gap: 16px; padding: 15px 0 16px; border-bottom: 1px solid #DFDCD3;">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
              <div style="{{item.nameStyle}}">{{item.nome}}</div>
              <div style="display: flex; align-items: baseline; gap: 9px;">
                <span style="{{item.confStyle}}">{{item.conf}}</span>
                <span style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.11em; color: #9B9689;">{{item.qty}}</span>
                <sc-if value="{{item.showSub}}" hint-placeholder-val="{{true}}">
                  <span style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 11px; letter-spacing: 0.07em; color: #B5B0A2;">{{item.sub}}</span>
                </sc-if>
              </div>
            </div>
            <div style="{{item.boxStyle}}">
              <sc-if value="{{item.done}}" hint-placeholder-val="{{true}}">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4.5 10.5 L8.2 14 L15.5 6.4" stroke="#F2F1EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </sc-if>
            </div>
          </button>
        </sc-for>

        <sc-for list="{{sec.controls}}" as="ctl" hint-placeholder-count="1">
          <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; padding: 17px 0 4px;">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
              <div style="font-size: 21px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; color: #14130F;">{{ctl.nome}}</div>
              <div style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 10.5px; font-weight: 500; letter-spacing: 0.13em; color: #9B9689;">{{ctl.hint}}</div>
            </div>
            <div style="display: flex; gap: 10px;">
              <button onClick="{{ctl.yes}}" style="{{ctl.yesStyle}}">SÌ</button>
              <button onClick="{{ctl.no}}" style="{{ctl.noStyle}}">NO</button>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px 20px 24px; border-top: 1px solid #14130F;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 15px;">
      <span style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.15em; color: #14130F;">{{progressLabel}}</span>
      <span style="font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.13em; color: #9B9689;">{{progressPct}}</span>
    </div>
    <div style="display: flex; gap: 26px;">
      <button onClick="{{goBase}}" style="{{baseTabStyle}}">BASE · {{baseCount}}</button>
      <button onClick="{{goTopup}}" style="{{topupTabStyle}}">TOP-UP · {{topupCount}}</button>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'base', done: { tonno: true, ceci: true }, ctl: {} }; }
  data() {
    return {
      base: [
        { rep: 'PASTA E CEREALI', items: [
          { id: 'riso', nome: 'Riso Carnaroli', conf: '1 CONF', qty: '1000 G', sub: 'in casa 0 g' },
          { id: 'avena', nome: "Fiocchi d'avena", conf: '1 CONF', qty: '500 G', sub: 'in casa 90 g' },
          { id: 'pasta', nome: 'Pasta integrale', conf: '2 CONF', qty: '1000 G', sub: '' }
        ], controls: [] },
        { rep: 'SCATOLAME', items: [
          { id: 'tonno', nome: 'Tonno al naturale', conf: '3 CONF', qty: '240 G', sub: '' },
          { id: 'ceci', nome: 'Ceci lessati', conf: '2 CONF', qty: '800 G', sub: '' },
          { id: 'passata', nome: 'Passata di pomodoro', conf: '1 CONF', qty: '700 G', sub: '' }
        ], controls: [ { id: 'olio', nome: 'Olio ancora?', hint: 'ULTIMO ACQUISTO 54 GIORNI FA' } ] },
        { rep: 'BEVANDE', items: [
          { id: 'caffe', nome: 'Caffè macinato', conf: '1 CONF', qty: '250 G', sub: '' }
        ], controls: [] }
      ],
      topup: [
        { rep: 'LATTICINI E UOVA', items: [
          { id: 'yogurt', nome: 'Yogurt greco', conf: '2 CONF', qty: '1000 G', sub: 'in casa 50 g' },
          { id: 'uova', nome: 'Uova', conf: '6 PZ', qty: '6 PZ', sub: '' }
        ], controls: [] },
        { rep: 'MACELLERIA', items: [
          { id: 'pollo', nome: 'Petto di pollo', conf: '1 CONF', qty: '700 G', sub: 'in casa 0 g' },
          { id: 'salmone', nome: 'Salmone', conf: '2 CONF', qty: '300 G', sub: '' }
        ], controls: [] },
        { rep: 'ORTOFRUTTA', items: [
          { id: 'spinaci', nome: 'Spinaci', conf: '2 CONF', qty: '400 G', sub: '' },
          { id: 'mele', nome: 'Mele', conf: '6 PZ', qty: '6 PZ', sub: '' }
        ], controls: [] }
      ]
    };
  }
  countOf(secs) { var n = 0; for (var i = 0; i < secs.length; i++) { n += secs[i].items.length; } return n; }
  renderVals() {
    var self = this;
    var d = this.data();
    var secs = (this.state.tab === 'base') ? d.base : d.topup;
    var boxOff = 'width: 30px; height: 30px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 1.5px solid #14130F; background: transparent;';
    var boxOn = 'width: 30px; height: 30px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 1.5px solid #14130F; background: #14130F;';
    var total = 0, done = 0;
    var sections = secs.map(function (s) {
      var items = s.items.map(function (it) {
        var isDone = !!self.state.done[it.id];
        total += 1; if (isDone) { done += 1; }
        return {
          nome: it.nome, conf: it.conf, qty: it.qty, sub: it.sub, done: isDone,
          showSub: !!it.sub && !isDone,
          boxStyle: isDone ? boxOn : boxOff,
          nameStyle: isDone
            ? 'font-size: 23px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.08; color: #B5B0A2; text-decoration: line-through; text-decoration-thickness: 1.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;'
            : 'font-size: 23px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.08; color: #14130F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;',
          confStyle: isDone
            ? "font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.13em; color: #B5B0A2;"
            : "font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.13em; color: #14130F;",
          toggle: function () { var nd = Object.assign({}, self.state.done); if (nd[it.id]) { delete nd[it.id]; } else { nd[it.id] = true; } self.setState({ done: nd }); }
        };
      });
      var controls = (s.controls || []).map(function (c) {
        var ans = self.state.ctl[c.id] || null;
        var b = "min-width: 56px; height: 46px; padding: 0 15px; text-align: center; font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.13em; border: 1.5px solid #14130F;";
        return {
          nome: c.nome, hint: c.hint,
          yesStyle: b + (ans === 'si' ? ' background: #14130F; color: #F2F1EE;' : ' background: transparent; color: #14130F;'),
          noStyle: b + (ans === 'no' ? ' background: #14130F; color: #F2F1EE;' : ' background: transparent; color: #14130F;'),
          yes: function () { var x = Object.assign({}, self.state.ctl); x[c.id] = 'si'; self.setState({ ctl: x }); },
          no: function () { var x = Object.assign({}, self.state.ctl); x[c.id] = 'no'; self.setState({ ctl: x }); }
        };
      });
      return { rep: s.rep, n: s.items.length + ' VOCI', items: items, controls: controls };
    });
    var pct = total ? Math.round((done / total) * 100) : 0;
    var tOn = "font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.13em; color: #14130F; border-bottom: 2px solid #14130F; padding-bottom: 9px; padding-top: 9px;";
    var tOff = "font-family: 'Archivo Narrow', 'Archivo', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.13em; color: #9B9689; border-bottom: 2px solid transparent; padding-bottom: 9px; padding-top: 9px;";
    return {
      sections: sections,
      baseCount: this.countOf(d.base), topupCount: this.countOf(d.topup),
      progressLabel: done + ' / ' + total + ' PRESI',
      progressPct: pct + '%',
      baseTabStyle: this.state.tab === 'base' ? tOn : tOff,
      topupTabStyle: this.state.tab === 'topup' ? tOn : tOff,
      goBase: function () { self.setState({ tab: 'base' }); },
      goTopup: function () { self.setState({ tab: 'topup' }); }
    };
  }
}
</script>
</body>
</html>
