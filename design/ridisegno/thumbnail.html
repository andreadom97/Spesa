<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Spesa</title>
<link rel="stylesheet" href="tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:854px;overflow:hidden}
body{display:flex}
.marca{flex:1;background:var(--ink);display:flex;align-items:center;justify-content:center}
.nome{font-family:var(--font-testo);font-weight:800;font-size:290px;letter-spacing:-.05em;line-height:1;color:#fff}
.strip{width:320px;display:flex;flex-direction:column}
.strip span{flex:1}
</style>
</head>
<body>
<div class="marca"><div class="nome">Spesa</div></div>
<div class="strip"><span style="background:var(--area-cereali)"></span><span style="background:var(--area-ortofrutta)"></span><span style="background:var(--area-surgelati)"></span><span style="background:var(--area-macelleria)"></span></div>
</body>
</html>
