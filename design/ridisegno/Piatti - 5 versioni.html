<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>Piatti — 5 versioni</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--fondo:#F1F0EE;--superficie:#FFFFFF;--ink:#14163A;--ink-2:#3D4166;--testo-2:#5C5F7A;--sec:#8A8A96;--ter:#A6A6B2;--off:#9A9AA6;
--bordo:rgba(20,22,58,0.07);--spento:rgba(20,22,58,0.035);--icona-spenta:#C4C4CE;--bordo-tratteggio:rgba(20,22,58,0.20);
--area-ortofrutta:#A8D96A;--area-macelleria:#F29B9B;--area-latticini:#9CC7F2;--area-cereali:#F5CE5B;--area-dispensa:#F2A465;--area-surgelati:#B9AEF5;
--font-testo:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--ombra-pannello:0 1px 2px rgba(20,22,58,.05),0 6px 16px rgba(20,22,58,.06);
--ombra-nav:0 2px 6px rgba(20,22,58,.08),0 12px 30px rgba(20,22,58,.16);
--moto-barra:200ms;--curva-barra:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box}
body{margin:0;background:#D8D7D4;font-family:var(--font-testo);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--ink)}a:hover{color:var(--ink-2)}
.frame{position:absolute;width:393px}
.sigla{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.intesta{display:flex;flex-direction:column;gap:6px;padding:0 2px 12px}
.intesta p{margin:0;font-size:12.5px;line-height:1.4;color:#3D4166}

.tel{width:393px;height:852px;border-radius:26px;overflow:hidden;position:relative;box-shadow:0 2px 4px rgba(20,22,58,.10),0 18px 40px rgba(20,22,58,.18);background:linear-gradient(180deg,#EDECEA 0%,#F2F1EF 34%,#F8F8F7 70%,#FCFCFB 100%);--fine:128px}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - var(--fine)),rgba(0,0,0,.55) calc(100% - 74px),rgba(0,0,0,0) calc(100% - 30px));
mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - var(--fine)),rgba(0,0,0,.55) calc(100% - 74px),rgba(0,0,0,0) calc(100% - 30px))}
.scroll::-webkit-scrollbar{width:0}

.testata{padding:20px 18px 12px;display:flex;flex-direction:column;gap:15px}
.testata-alto{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.titolo-sch{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:0}
.utente{height:50px;display:flex;align-items:center;gap:5px;margin:0 -2px -3px 0;background:rgba(20,22,58,.07);border:0;border-radius:999px;padding:0 12px 0 6px}
.utente .tondo{width:38px;height:38px;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.iniziale{font-family:var(--font-mono);font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:#fff}

.campo{margin:0 16px 12px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--bordo);box-shadow:var(--ombra-pannello);display:flex;align-items:center;gap:9px;padding:0 14px}
.campo input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--font-testo);font-size:14px;color:var(--ink)}
.campo input::placeholder{color:var(--testo-2)}
.pillole{display:flex;gap:7px;padding:0 16px 12px;overflow:hidden}
.pillole button{height:44px;display:flex;align-items:center;padding:0 15px;border-radius:999px;background:#fff;border:1px solid rgba(20,22,58,.09);font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sec);white-space:nowrap}
.pillole button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.segmento{display:flex;gap:7px;padding:0 16px 12px}
.segmento button{flex:1;height:46px;border-radius:14px;background:#fff;border:1px solid rgba(20,22,58,.09);font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sec)}
.segmento button.on{background:var(--ink);border-color:var(--ink);color:#fff}

.w{margin:0 12px 12px;background:#fff;border:1px solid var(--bordo);border-radius:22px;box-shadow:var(--ombra-pannello);padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px}
.w-testa{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.w-lb{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.w-cont{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.10em;text-transform:uppercase;color:var(--sec)}
.w-nota{font-size:12.5px;line-height:1.4;color:var(--testo-2);padding:0 4px;margin:0}
.righe{display:flex;flex-direction:column;gap:6px}

/* riga piatto */
.rp{display:flex;align-items:center;border-radius:14px;background:none;border:0;padding:0;min-height:68px;text-align:left;font:inherit;color:inherit;width:100%}
.rp.bianca{background:#fff;border:1px solid rgba(20,22,58,.09);box-shadow:var(--ombra-pannello)}
.rp-corpo{flex:1;min-width:0;padding:12px 8px 12px 12px;display:flex;flex-direction:column;gap:3px}
.rp-nome{font-size:17px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-sub{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ter)}
.rp-sub.info{color:var(--testo-2);font-weight:700}
.rp-aree{display:flex;gap:4px;margin-top:2px}
.rp-aree i{width:8px;height:8px;border-radius:2.6px}
.rp-dx{width:44px;flex:none;display:flex;align-items:center;justify-content:center}

/* tessera piatto */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tp{min-height:104px;border-radius:14px;background:#fff;border:1px solid rgba(20,22,58,.09);box-shadow:var(--ombra-pannello);padding:12px 14px 13px;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit}
.tp-pil{font-family:var(--font-mono);font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:5px 10px;background:rgba(20,22,58,.06);color:var(--ink);align-self:flex-start}
.tp-nome{font-size:17px;font-weight:700;letter-spacing:-.032em;line-height:1.1;margin-top:auto}
.tp-sub{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--ter);margin-top:5px}

/* aggiungi */
.agg{border-radius:14px;border:2px dashed var(--bordo-tratteggio);background:none;min-height:56px;display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);width:100%}
.agg.tessera{min-height:104px;flex-direction:column}
.coda{height:140px}

.nav{position:absolute;left:16px;right:16px;bottom:22px;height:84px;border-radius:999px;display:flex;align-items:center;gap:2px;padding:6px;background:#fff;box-shadow:var(--ombra-nav)}
.nav .voce{flex:1;height:72px;border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;overflow:hidden}
.nav .voce.on{background:rgba(20,22,58,.07)}
.nav .segno{display:flex;align-items:center;justify-content:center;flex:none;height:26px}
.nav .lb{font-family:var(--font-mono);font-size:8.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--off);white-space:nowrap;max-height:12px;opacity:1}
.nav .voce.on .lb{color:var(--ink);font-weight:700}
.marchio{display:grid;gap:4px}
.cas{border-radius:2.52px;border:2px solid transparent}
.tel.giu .nav{height:66px;left:46px;right:46px}
.tel.giu .nav .voce{height:54px;gap:0}
.tel.giu .nav .lb{max-height:0;opacity:0}
.tel.giu{--fine:110px}
@media (prefers-reduced-motion: no-preference){
  .nav,.nav .voce,.nav .lb{transition:height var(--moto-barra) var(--curva-barra),max-height var(--moto-barra) var(--curva-barra),opacity 150ms linear,gap var(--moto-barra) var(--curva-barra),left var(--moto-barra) var(--curva-barra),right var(--moto-barra) var(--curva-barra)}
}

.note{width:393px;margin-top:12px;background:#fff;border:1px solid var(--bordo);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.note p{margin:0;font-size:12.5px;line-height:1.45;color:var(--testo-2)}
.note strong{color:var(--ink)}
.comp{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--sec);line-height:1.7}
.rompe{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#9A5C00;line-height:1.6}
</style>
</head>
<body>
<div id="canvas"></div>
<script>
const A={orto:'#A8D96A',mac:'#F29B9B',lat:'#9CC7F2',cer:'#F5CE5B',dis:'#F2A465',sur:'#B9AEF5'};
const ORD=[[A.dis,1],[A.lat,1],[A.orto,0],[A.sur,1],[A.cer,1],[A.mac,0]];

const P={
 fagioli:{nome:'Pasta e fagioli',porz:2,ingr:7,aree:[A.cer,A.dis,A.orto],cat:'Primi',volte:8,ultima:'17/09/2026'},
 risotto:{nome:'Risotto alla milanese',porz:2,ingr:6,aree:[A.cer,A.lat],cat:'Primi',volte:11,ultima:'14/09/2026'},
 farro:{nome:'Insalata di farro',porz:2,ingr:6,aree:[A.cer,A.orto],cat:'Primi',volte:5,ultima:'15/09/2026'},
 lasagne:{nome:'Lasagne al forno',porz:4,ingr:10,aree:[A.cer,A.lat,A.mac],cat:'Primi',volte:4,ultima:'20/09/2026'},
 cous:{nome:'Cous cous di verdure',porz:2,ingr:8,aree:[A.cer,A.orto],cat:'Primi',volte:2,ultima:'30/07/2026'},
 pollo:{nome:'Pollo al limone',porz:2,ingr:5,aree:[A.mac,A.orto],cat:'Secondi',volte:9,ultima:'15/09/2026'},
 orata:{nome:'Orata al forno',porz:2,ingr:5,aree:[A.mac,A.orto],cat:'Secondi',volte:4,ultima:'18/09/2026'},
 frittata:{nome:'Frittata di zucchine',porz:2,ingr:4,aree:[A.lat,A.orto],cat:'Secondi',volte:10,ultima:'17/09/2026'},
 parmigiana:{nome:'Parmigiana di melanzane',porz:4,ingr:7,aree:[A.orto,A.lat,A.dis],cat:'Secondi',volte:9,ultima:'05/09/2026'},
 polpette:{nome:'Polpette al sugo',porz:4,ingr:8,aree:[A.mac,A.dis],cat:'Secondi',volte:7,ultima:'01/09/2026'},
 torta:{nome:'Torta salata di verdure',porz:4,ingr:9,aree:[A.orto,A.lat,A.cer],cat:'Secondi',volte:6,ultima:'28/08/2026'},
 sformato:{nome:'Sformato di spinaci',porz:2,ingr:6,aree:[A.orto,A.lat],cat:'Secondi',volte:2,ultima:'09/07/2026'},
 lenticchie:{nome:'Zuppa di lenticchie',porz:2,ingr:8,aree:[A.dis,A.orto],cat:'Zuppe e vellutate',volte:7,ultima:'14/09/2026'},
 minestrone:{nome:'Minestrone',porz:4,ingr:9,aree:[A.orto,A.dis],cat:'Zuppe e vellutate',volte:6,ultima:'18/09/2026'},
 zucca:{nome:'Vellutata di zucca',porz:2,ingr:5,aree:[A.orto,A.lat],cat:'Zuppe e vellutate',volte:5,ultima:'19/09/2026'},
 ceci:{nome:'Zuppa di ceci',porz:2,ingr:7,aree:[A.dis,A.orto],cat:'Zuppe e vellutate',volte:1,ultima:'18/07/2026'},
 yogurt:{nome:'Yogurt con avena',porz:1,ingr:3,aree:[A.lat,A.cer],cat:'Colazioni',volte:24,ultima:'20/09/2026'},
 marmellata:{nome:'Pane e marmellata',porz:1,ingr:2,aree:[A.cer,A.dis],cat:'Colazioni',volte:12,ultima:'18/09/2026'},
 fette:{nome:'Fette con ricotta e miele',porz:1,ingr:3,aree:[A.cer,A.lat],cat:'Colazioni',volte:9,ultima:'14/09/2026'}
};
const TUTTI=Object.values(P);
const CAT=['Primi','Secondi','Zuppe e vellutate','Colazioni'].map(lb=>({lb,v:TUTTI.filter(p=>p.cat===lb)}));
const plur=(n,s,p)=>`${n} ${n===1?s:p}`;
const misura=p=>`${plur(p.porz,'porzione','porzioni')} · ${plur(p.ingr,'ingrediente','ingredienti')}`;

/* il piano del 14-20 settembre, gli stessi piatti della schermata Piano */
const PIANO=['fette','risotto','lenticchie','yogurt','farro','pollo','frittata','yogurt','fagioli','frittata','marmellata','minestrone','orata','zucca','yogurt','lasagne'];
const inPiano={};PIANO.forEach(k=>inPiano[k]=(inPiano[k]||0)+1);
const chiavi=Object.keys(P);
const G1=chiavi.filter(k=>inPiano[k]).sort((a,b)=>inPiano[b]-inPiano[a]||P[a].nome.localeCompare(P[b].nome))
  .map(k=>[P[k],`${plur(inPiano[k],'volta','volte')} questa settimana`]);
const G2=chiavi.filter(k=>!inPiano[k]&&P[k].volte>=6).sort((a,b)=>P[b].volte-P[a].volte)
  .map(k=>[P[k],`${P[k].volte} volte da giugno`]);
const G3=chiavi.filter(k=>!inPiano[k]&&P[k].volte<6).sort((a,b)=>P[b].ultima.slice(6)+P[b].ultima.slice(3,5)+P[b].ultima.slice(0,2)>P[a].ultima.slice(6)+P[a].ultima.slice(3,5)+P[a].ultima.slice(0,2)?1:-1)
  .map(k=>[P[k],`Ultima volta il ${P[k].ultima}`]);

const CHEV=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="#C4C4CE" stroke-width="2.1" stroke-linecap="round"/></svg>`;
const LENTE=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.6" stroke="#8A8A96" stroke-width="2.1"/><path d="M15.4 15.4 20 20" stroke="#8A8A96" stroke-width="2.1" stroke-linecap="round"/></svg>`;
const PIU=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#14163A" stroke-width="2.1" stroke-linecap="round"/></svg>`;

function rp(p,opz){const o=opz||{};return `<button type="button" class="rp ${o.bianca?'bianca':''}" aria-label="Apri ${p.nome}">
  <span class="rp-corpo">
    <span class="rp-nome">${p.nome}</span>
    <span class="rp-sub ${o.info?'info':''}">${o.sub||misura(p)}</span>
    <span class="rp-aree">${p.aree.map(c=>`<i style="background:${c}"></i>`).join('')}</span>
  </span>
  <span class="rp-dx">${CHEV}</span></button>`}
function tp(p){return `<button type="button" class="tp" aria-label="Apri ${p.nome}">
  <span class="tp-pil">${p.porz} ${p.porz===1?'porz':'porz'}</span>
  <span class="tp-nome">${p.nome}</span>
  <span class="tp-sub">${p.ingr} ingredienti</span></button>`}
const AGG=t=>`<button type="button" class="agg">${PIU}${t}</button>`;
const AGGT=`<button type="button" class="agg tessera">${PIU}<span>Nuovo piatto</span></button>`;

function testata(){return `<div class="testata">
  <div class="testata-alto">
    <h1 class="titolo-sch">Piatti</h1>
    <button type="button" class="utente" aria-label="Andrea: profilo e impostazioni"><span class="tondo"><span class="iniziale" aria-hidden="true">A</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="5.2" r="2.1" fill="#14163A"/><circle cx="12" cy="12" r="2.1" fill="#14163A"/><circle cx="12" cy="18.8" r="2.1" fill="#14163A"/></svg></button>
  </div>
</div>`}
const CAMPO=`<div class="campo">${LENTE}<input type="search" aria-label="Cerca un piatto" placeholder="Cerca un piatto"></div>`;
const PILLOLE=`<div class="pillole" role="group" aria-label="Filtra i piatti"><button type="button" class="on" aria-pressed="true">Tutti</button><button type="button" aria-pressed="false">Primi</button><button type="button" aria-pressed="false">Secondi</button><button type="button" aria-pressed="false">Zuppe</button></div>`;
const SEGMENTO=`<div class="segmento" role="group" aria-label="Filtra per pasto"><button type="button" class="on" aria-pressed="true">Tutti</button><button type="button" aria-pressed="false">Pranzo</button><button type="button" aria-pressed="false">Cena</button></div>`;

function marchio(l){return `<span class="marchio" style="grid-template-columns:repeat(3,${l}px);grid-auto-rows:${l}px" aria-hidden="true">${ORD.map(([c,p])=>`<span class="cas" style="border-color:${c};background:${p?c:'transparent'}"></span>`).join('')}</span>`}
const IC={
 piano:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15.5" rx="4.4" fill="#9A9AA6"/><rect x="6.2" y="8.4" width="11.6" height="2.1" rx="1.05" fill="#fff" opacity=".92"/><circle cx="8.2" cy="14.6" r="1.7" fill="#fff" opacity=".92"/><circle cx="12" cy="14.6" r="1.7" fill="#fff" opacity=".92"/><circle cx="15.8" cy="14.6" r="1.7" fill="#fff" opacity=".92"/></svg>`,
 piatti:(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="${c}"/><circle cx="12" cy="12" r="4.1" fill="#fff" opacity=".92"/></svg>`,
 dispensa:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3.4" width="14" height="3.6" rx="1.8" fill="#9A9AA6"/><path d="M6 9.4h12a1 1 0 0 1 1 1v6.4a3.2 3.2 0 0 1-3.2 3.2H8.2A3.2 3.2 0 0 1 5 16.8v-6.4a1 1 0 0 1 1-1Z" fill="#9A9AA6"/><rect x="8.4" y="12.4" width="7.2" height="2.1" rx="1.05" fill="#fff" opacity=".92"/></svg>`};
const NAV=`<nav class="nav" aria-label="Sezioni">
  <button type="button" class="voce" aria-pressed="false" aria-label="Lista"><span class="segno">${marchio(9)}</span><span class="lb">Lista</span></button>
  <button type="button" class="voce" aria-pressed="false" aria-label="Piano"><span class="segno">${IC.piano(26)}</span><span class="lb">Piano</span></button>
  <button type="button" class="voce on" aria-pressed="true" aria-label="Piatti"><span class="segno">${IC.piatti(26,'#14163A')}</span><span class="lb">Piatti</span></button>
  <button type="button" class="voce" aria-pressed="false" aria-label="Dispensa"><span class="segno">${IC.dispensa(26)}</span><span class="lb">Dispensa</span></button>
</nav>`;

const CORPI={
 v1:()=>`${CAMPO}${PILLOLE}<section class="w"><div class="w-testa"><span class="w-lb">I tuoi piatti</span><span class="w-cont">${plur(TUTTI.length,'piatto','piatti')}</span></div><div class="righe">${TUTTI.map(p=>rp(p)).join('')}${AGG('Nuovo piatto')}</div></section>`,

 v2:()=>`${CAMPO}${CAT.map(s=>`<section class="w"><div class="w-testa"><span class="w-lb">${s.lb}</span><span class="w-cont">${plur(s.v.length,'piatto','piatti')}</span></div><div class="righe">${s.v.map(p=>rp(p)).join('')}</div></section>`).join('')}<section class="w"><div class="righe">${AGG('Nuovo piatto')}</div></section>`,

 v3:()=>`${CAMPO}${CAT.map((s,i)=>`<section class="w"><div class="w-testa"><span class="w-lb">${s.lb}</span><span class="w-cont">${plur(s.v.length,'piatto','piatti')}</span></div><div class="grid">${s.v.map(tp).join('')}${i===0?AGGT:''}</div></section>`).join('')}`,

 v4:()=>`${[
   {lb:'Nel piano questa settimana',nota:'Sono i piatti che hai messo nel piano dal 14 al 20 settembre.',v:G1},
   {lb:'Li cucini spesso, ma non questa settimana',nota:'Almeno sei volte da giugno, e questa settimana non li hai messi nel piano.',v:G2},
   {lb:'Non li usi da un mese',nota:'Non li hai messi nel piano dal 12/08/2026.',v:G3}
  ].map(s=>`<section class="w"><div class="w-testa"><span class="w-lb">${s.lb}</span><span class="w-cont">${plur(s.v.length,'piatto','piatti')}</span></div><p class="w-nota">${s.nota}</p><div class="righe">${s.v.map(([p,sub])=>rp(p,{sub,info:true})).join('')}</div></section>`).join('')}<section class="w"><div class="righe">${AGG('Nuovo piatto')}</div></section>`,


 v5:()=>`${CAMPO}${SEGMENTO}<div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:8px">${TUTTI.map(p=>rp(p,{bianca:true})).join('')}${AGG('Nuovo piatto')}</div>`

const V=[
 {k:'v1',id:'1',nome:'Un widget, tutti i piatti',

  m:'Campo di testo: alto 44, raggio 14, bianco, bordo 1, padding 0 14, testo 14, lente 18 px con nome accessibile “Cerca un piatto”. Pillole: alte 44 (il disegno è il bersaglio), raggio 999, mono 11 / 700 / 0,08em, attiva su --ink. Widget: raggio 22, bordo 1, ombra dei pannelli, padding 14 / 12 / 12. Riga piatto: minimo 68, corpo + chevron 44.',
  r:'COMPONENTE NUOVO: Riga piatto'},

 {k:'v2',id:'2',nome:'Un widget per categoria',

  m:'Stesse misure della 1 per campo e widget. Quattro widget, uno per categoria, margine 0 12 12, gap interno 10. Righe nude minimo 68. Il tasto “Nuovo piatto” sta in un widget suo in fondo: tratteggiato 2 px in rgba(20,22,58,0.20), raggio 14, minimo 56.',

 {k:'v3',id:'3',nome:'Tessere, due per riga',

  r:'COMPONENTE NUOVO: Tessera piatto, con la geometria della tessera della Lista ma senza colore d\'area · §8 le categorie dei piatti non esistono ancora nel sistema'},

 {k:'v4',id:'4',nome:'Ordinati per come li usi',
  p:'Nessuna categoria e nessun filtro: i piatti stanno in tre gruppi che dicono un fatto — “Nel piano questa settimana”, “Li cucini spesso, ma non questa settimana”, “Non li usi da un mese”. I tre gruppi sono ricavati da un dato solo, il piano del 14-20 settembre più lo storico, quindi non si sovrappongono per costruzione. Ogni gruppo ha una nota che spiega da dove viene l\'ordine, e ogni riga porta il suo numero invece della misura.',
  m:'Stesse misure della 2. In più, sotto l\'intestazione di ogni widget, una nota 12,5 in --testo-2 che dichiara il calcolo. La sottoriga della riga piatto passa da misura a conteggio e va in --testo-2 peso 700, perché porta informazione: 5,5:1.',

  m:'Campo come nella 1. Segmento a blocco: tre rettangoli flex 1, alti 46, raggio 14, gap 7, mono 11 / 700 / 0,08em, un attivo alla volta con aria-pressed. Righe piatto bianche: raggio 14, bordo 1 px rgba(20,22,58,0.09), ombra dei pannelli, minimo 68, gap 8, lati 12.',

V.forEach((v,i)=>{
  const el=document.createElement('div');

    <div class="sigla">Misure</div>

    <div class="sigla" style="margin-top:4px">Componenti usati</div>
    <div class="comp">Testata (titolo + menù utente) · Menù utente · ${v.k==='v4'?'':'Campo di testo · '}${v.k==='v1'?'Pillole d\'azione · ':''}${v.k==='v5'?'Segmento a blocco · ':''}Etichetta di sezione con contatore · ${v.k==='v3'?'Tessera piatto · ':'Riga piatto · '}Aggiungi tratteggiato · Tab bar in pillola a due stati</div>
    <div class="sigla" style="margin-top:4px">Regole di DESIGN.md che tocca</div>
    <div class="rompe">§12 gradiente di sfondo · §5 ombra nuova sui pannelli e sulla barra · §8 menù utente e tab bar in pillola · §7 lo scorrimento come gesto · ${v.r}</div>
  </div>`;
  c.appendChild(el);

  const tel=el.querySelector('.tel'), sc=el.querySelector('.scroll');
