<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>Lista — sezioni come widget, 5 versioni</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--fondo:#F1F0EE;--superficie:#FFFFFF;--ink:#14163A;--ink-2:#3D4166;--testo-2:#5C5F7A;--sec:#8A8A96;--ter:#A6A6B2;--off:#9A9AA6;
--bordo:rgba(20,22,58,0.07);--spento:rgba(20,22,58,0.035);
--area-ortofrutta:#A8D96A;--area-macelleria:#F29B9B;--area-latticini:#9CC7F2;--area-cereali:#F5CE5B;--area-dispensa:#F2A465;--area-surgelati:#B9AEF5;
--font-testo:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--ombra-pannello:0 1px 2px rgba(20,22,58,.05),0 6px 16px rgba(20,22,58,.06);
--ombra-nav:0 2px 6px rgba(20,22,58,.08),0 12px 30px rgba(20,22,58,.16);
--moto-barra:200ms;--curva-barra:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box}
body{margin:0;background:#D8D7D4;font-family:var(--font-testo);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--ink)}a:hover{color:var(--ink-2)}
.frame{position:absolute;width:393px}
.sigla{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.intesta{display:flex;flex-direction:column;gap:6px;padding:0 2px 12px}
.intesta p{margin:0;font-size:12.5px;line-height:1.4;color:#3D4166}

.tel{width:393px;height:852px;border-radius:26px;overflow:hidden;position:relative;box-shadow:0 2px 4px rgba(20,22,58,.10),0 18px 40px rgba(20,22,58,.18);background:linear-gradient(180deg,#EDECEA 0%,#F2F1EF 34%,#F8F8F7 70%,#FCFCFB 100%);--fine:128px}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - var(--fine)),rgba(0,0,0,.55) calc(100% - 74px),rgba(0,0,0,0) calc(100% - 30px));
mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - var(--fine)),rgba(0,0,0,.55) calc(100% - 74px),rgba(0,0,0,0) calc(100% - 30px))}
.scroll::-webkit-scrollbar{width:0}

.testata{padding:20px 18px 12px;display:flex;flex-direction:column;gap:15px}
.testata-alto{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.titolo-sch{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:0}
.pill-sett{height:34px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;display:inline-flex;align-items:center;padding:0 14px;align-self:flex-start}
.utente{height:50px;display:flex;align-items:center;gap:5px;margin:0 -2px -3px 0;background:rgba(20,22,58,.07);border:0;border-radius:999px;padding:0 12px 0 6px}
.utente .tondo{width:38px;height:38px;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.iniziale{font-family:var(--font-mono);font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:#fff}
.stato-riga{font-size:12.5px;line-height:1.4;color:var(--testo-2);padding:0 16px 10px;margin:0}

/* sezione: intestazione e griglia, comuni */
.sez{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sez-sx{display:flex;align-items:center;gap:8px}
.quad{width:10px;height:10px;border-radius:4px;flex:none}
.sez-lb{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.sez-cont{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.10em;text-transform:uppercase;color:var(--sec)}
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tessera{min-height:104px;display:flex;flex-direction:column;padding:12px 14px 13px;border-radius:14px;text-align:left;border:1px solid transparent;background:none;font:inherit;color:inherit}
.accesa{background:var(--superficie)}
.spenta{background:var(--spento)}
.prot{grid-column:span 2;padding:13px 16px 14px;border-radius:18px}
.alto{display:flex;align-items:center;gap:6px;flex:none}
.pil{font-family:var(--font-mono);font-weight:700;font-size:10.5px;letter-spacing:.07em;border-radius:999px;padding:5px 10px;text-transform:uppercase}
.qty{font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.nome{font-size:17px;font-weight:700;letter-spacing:-.032em;line-height:1.1;margin-top:10px}
.nome-g{font-size:25px}
.barrato{text-decoration:line-through;text-decoration-thickness:1.6px;color:rgba(20,22,58,.34)}
.sub{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.02em;margin-top:5px;text-transform:uppercase}
.controllo{border-radius:18px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.controllo-nome{font-size:16px;font-weight:700;letter-spacing:-.024em}
.controllo-sub{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--testo-2);margin-top:4px}
.sino{display:flex;gap:7px}
.sino button{height:44px;min-width:52px;border-radius:999px;background:#fff;border:1px solid rgba(20,22,58,.09);font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.coda{height:140px}

/* i cinque involucri */
.w1{margin:0 12px 12px;background:#fff;border:1px solid var(--bordo);border-radius:22px;box-shadow:var(--ombra-pannello);padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px}
.w2{margin:0 12px 12px;border-radius:22px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px}
.w3{margin:0 12px 12px;background:#fff;border:1px solid var(--bordo);border-radius:22px;box-shadow:var(--ombra-pannello);overflow:hidden}
.w3 .cappello{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.w3 .dentro{padding:12px;display:flex;flex-direction:column;gap:12px}
.w4{margin:0 12px 26px;display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--bordo)}
.w5{margin:0 12px 12px;background:#fff;border:1px solid var(--bordo);border-radius:22px;box-shadow:var(--ombra-pannello);overflow:hidden;display:flex;flex-direction:column}
.w5 .testa{padding:12px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.w5 .testa .sez{flex:1}
.w5 .cima{padding:13px 16px 15px;border-radius:0;grid-column:auto;display:flex;flex-direction:column;border:0;text-align:left;font:inherit;color:inherit}
.w5 .dentro{padding:12px;display:flex;flex-direction:column;gap:12px}

.nav{position:absolute;left:16px;right:16px;bottom:22px;height:84px;border-radius:999px;display:flex;align-items:center;gap:2px;padding:6px;background:#fff;box-shadow:var(--ombra-nav)}
.nav .voce{flex:1;height:72px;border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;overflow:hidden}
.nav .voce.on{background:rgba(20,22,58,.07)}
.nav .segno{display:flex;align-items:center;justify-content:center;flex:none}
.nav .lb{font-family:var(--font-mono);font-size:8.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--off);white-space:nowrap;max-height:12px;opacity:1}
.nav .voce.on .lb{color:var(--ink);font-weight:700}
.marchio{display:grid;gap:4px}
.cas{border-radius:2.52px;border:2px solid transparent}
.tel.giu .nav{height:66px;left:46px;right:46px}
.tel.giu .nav .voce{height:54px;gap:0}
.tel.giu .nav .lb{max-height:0;opacity:0}
.tel.giu{--fine:110px}
@media (prefers-reduced-motion: no-preference){
  .nav,.nav .voce,.nav .lb{transition:height var(--moto-barra) var(--curva-barra),max-height var(--moto-barra) var(--curva-barra),opacity 150ms linear,gap var(--moto-barra) var(--curva-barra),left var(--moto-barra) var(--curva-barra),right var(--moto-barra) var(--curva-barra)}
}

.note{width:393px;margin-top:12px;background:#fff;border:1px solid var(--bordo);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.note p{margin:0;font-size:12.5px;line-height:1.45;color:var(--testo-2)}
.note strong{color:var(--ink)}
.comp{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--sec);line-height:1.7}
.rompe{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#9A5C00;line-height:1.6}
</style>
</head>
<body>
<div id="canvas"></div>
<script>
const A={orto:'#A8D96A',mac:'#F29B9B',lat:'#9CC7F2',cer:'#F5CE5B',dis:'#F2A465',sur:'#B9AEF5'};
const RGB={'#A8D96A':'168,217,106','#F29B9B':'242,155,155','#9CC7F2':'156,199,242','#F5CE5B':'245,206,91','#F2A465':'242,164,101','#B9AEF5':'185,174,245'};
const ORD=[[A.dis,1],[A.lat,1],[A.orto,0],[A.sur,1],[A.cer,1],[A.mac,0]];

const DATI=[
 {c:A.orto,nome:'Ortofrutta',n:'4 voci',voci:[
  {s:'prot',pil:'2 conf',qty:'1250 g',nome:'Pomodori ramati',sub:'serve 1100 g · in casa 0 g'},
  {s:'accesa',pil:'1 conf',qty:'600 g',nome:'Zucchine',sub:'serve 540 g · in casa 0 g'},
  {s:'spenta',pil:'4 pz',qty:'4 pz',nome:'Limoni'},
  {s:'accesa',pil:'2 conf',qty:'500 g',nome:'Spinaci',sub:'serve 460 g · in casa 0 g'}]},
 {c:A.lat,nome:'Latticini, uova e salumi',n:'3 voci',voci:[
  {s:'prot',pil:'1 conf',qty:'6 pz',nome:'Uova medie',sub:'serve 5 pz · in casa 0 pz'},
  {s:'accesa',pil:'1 conf',qty:'250 g',nome:'Ricotta',sub:'serve 220 g · in casa 0 g'},
  {s:'spenta',pil:'1 conf',qty:'200 g',nome:'Parmigiano'}]},
 {c:A.cer,nome:'Pasta, riso e cereali',n:'2 voci',voci:[
  {s:'prot',pil:'2 conf',qty:'1000 g',nome:'Spaghetti n. 5',sub:'serve 840 g · in casa 120 g'},
  {s:'accesa',pil:'1 conf',qty:'1000 g',nome:'Riso carnaroli',sub:'serve 640 g · in casa 0 g'}]},
 {c:A.mac,nome:'Macelleria e pescheria',n:'2 voci',voci:[
  {s:'prot',pil:'1 conf',qty:'600 g',nome:'Petto di pollo',sub:'serve 560 g · in casa 0 g'},
  {s:'accesa',pil:'1 conf',qty:'150 g',nome:'Guanciale',sub:'serve 120 g · in casa 0 g'}]},
 {c:A.dis,nome:'Dispensa e conserve',n:'2 voci',voci:[
  {s:'prot',pil:'2 conf',qty:'800 g',nome:'Pomodori pelati',sub:'serve 720 g · in casa 0 g'},
  {s:'accesa',pil:'1 conf',qty:'500 g',nome:'Passata di pomodoro',sub:'serve 400 g · in casa 0 g'}],
  controllo:{nome:'Olio: ne hai ancora?',cad:'controllo ogni 4 settimane',c:A.dis}}
];

/* tessera. modo: 'fondo' come oggi · 'nuda' accesa trasparente col filo d'area · 'neutra' protagonista senza tinta */
function tessera(v,c,modo){
  const r=RGB[c];
  const etichetta=v.s==='spenta'?`${v.nome}, presa, tocca per rimetterla da prendere`:`${v.nome}, da prendere, tocca per segnare presa`;
  let cl='tessera',st='',pilSt='',qtySt='',subSt='',nomeCl='nome';
  if(v.s==='prot'){
    cl+=' prot';nomeCl+=' nome-g';
    if(modo==='neutra'){cl+=' accesa';st=`border-color:rgba(${r},.45)`;pilSt=`background:rgba(${r},.32);color:var(--ink)`;qtySt='color:var(--sec)';subSt='color:var(--ter)';}
    else{st=`background:${c}`;pilSt='background:#fff;color:var(--ink)';qtySt='color:rgba(20,22,58,.55)';subSt='color:rgba(20,22,58,.55)';}
  }else if(v.s==='accesa'){
    st=`border-color:rgba(${r},.45)`;pilSt=`background:rgba(${r},.32);color:var(--ink)`;qtySt='color:var(--sec)';subSt='color:var(--ter)';
    cl+=modo==='nuda'?'':' accesa';
  }else{
    cl+=' spenta';nomeCl+=' barrato';pilSt='background:rgba(20,22,58,.06);color:rgba(20,22,58,.34)';qtySt='color:rgba(20,22,58,.24)';
  }
  return `<button type="button" class="${cl}" style="${st}" aria-pressed="${v.s==='spenta'?'false':'true'}" aria-label="${etichetta}">
    <span class="alto"><span class="pil" style="${pilSt}">${v.pil}</span><span class="qty" style="${qtySt}">${v.qty}</span></span>
    <span class="${nomeCl}">${v.nome}</span>${v.sub&&v.s!=='spenta'?`<span class="sub" style="${subSt}">${v.sub}</span>`:''}</button>`;
}
function griglia(d,modo,salta){return `<div class="griglia">${d.voci.filter((v,i)=>!(salta&&i===0)).map(v=>tessera(v,d.c,modo)).join('')}</div>`}
function intest(d,sopra){return `<div class="sez"><div class="sez-sx"><span class="quad" style="background:${d.c}"></span><span class="sez-lb">${d.nome}</span></div><span class="sez-cont" ${sopra?'style="color:rgba(20,22,58,.55)"':''}>${d.n}</span></div>`}
function controllo(d){return d.controllo?`<div class="controllo" style="background:rgba(${RGB[d.controllo.c]},.26)"><div><div class="controllo-nome">${d.controllo.nome}</div><div class="controllo-sub">${d.controllo.cad}</div></div><div class="sino"><button type="button">Sì</button><button type="button">No</button></div></div>`:''}

const INVOLUCRI={
 w1:d=>`<section class="w1">${intest(d)}${griglia(d,'nuda')}${controllo(d)}</section>`,
 w2:d=>`<section class="w2" style="background:rgba(${RGB[d.c]},.26)">${intest(d)}${griglia(d,'fondo')}${controllo(d)}</section>`,
 w3:d=>`<section class="w3"><div class="cappello" style="background:${d.c}">${intest(d,true).replace('<div class="sez-sx"><span class="quad" style="background:'+d.c+'"></span>','<div class="sez-sx">').replace('<div class="sez">','<div class="sez" style="width:100%">')}</div><div class="dentro">${griglia(d,'neutra')}${controllo(d)}</div></section>`,
 w4:d=>`<section class="w4">${intest(d)}${griglia(d,'fondo')}${controllo(d)}</section>`,
 w5:d=>{const p=d.voci[0];return `<section class="w5"><div class="testa">${intest(d)}</div><button type="button" class="cima" style="background:${d.c}" aria-pressed="true" aria-label="${p.nome}, da prendere, tocca per segnare presa"><span class="alto"><span class="pil" style="background:#fff;color:var(--ink)">${p.pil}</span><span class="qty" style="color:rgba(20,22,58,.55)">${p.qty}</span></span><span class="nome nome-g">${p.nome}</span><span class="sub" style="color:rgba(20,22,58,.55)">${p.sub}</span></button><div class="dentro">${griglia(d,'fondo',true)}${controllo(d)}</div></section>`}
};

function marchio(l){return `<span class="marchio" style="grid-template-columns:repeat(3,${l}px);grid-auto-rows:${l}px" aria-hidden="true">${ORD.map(([c,p])=>`<span class="cas" style="border-color:${c};background:${p?c:'transparent'}"></span>`).join('')}</span>`}
const IC={
 settimana:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15.5" rx="4.4" fill="#9A9AA6"/><rect x="6.2" y="8.4" width="11.6" height="2.1" rx="1.05" fill="#fff" opacity=".92"/><circle cx="8.2" cy="14.6" r="1.7" fill="#fff" opacity=".92"/><circle cx="12" cy="14.6" r="1.7" fill="#fff" opacity=".92"/><circle cx="15.8" cy="14.6" r="1.7" fill="#fff" opacity=".92"/></svg>`,
 piatti:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#9A9AA6"/><circle cx="12" cy="12" r="4.1" fill="#fff" opacity=".92"/></svg>`,
 dispensa:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3.4" width="14" height="3.6" rx="1.8" fill="#9A9AA6"/><path d="M6 9.4h12a1 1 0 0 1 1 1v6.4a3.2 3.2 0 0 1-3.2 3.2H8.2A3.2 3.2 0 0 1 5 16.8v-6.4a1 1 0 0 1 1-1Z" fill="#9A9AA6"/><rect x="8.4" y="12.4" width="7.2" height="2.1" rx="1.05" fill="#fff" opacity=".92"/></svg>`};
const NAV=`<nav class="nav" aria-label="Sezioni">
  <button type="button" class="voce on" aria-pressed="true" aria-label="Lista"><span class="segno">${marchio(9)}</span><span class="lb">Lista</span></button>
  <button type="button" class="voce" aria-pressed="false" aria-label="Settimana"><span class="segno">${IC.settimana(26)}</span><span class="lb">Settimana</span></button>
  <button type="button" class="voce" aria-pressed="false" aria-label="Piatti"><span class="segno">${IC.piatti(26)}</span><span class="lb">Piatti</span></button>
  <button type="button" class="voce" aria-pressed="false" aria-label="Dispensa"><span class="segno">${IC.dispensa(26)}</span><span class="lb">Dispensa</span></button>
</nav>`;

function schermata(k){return `<div class="scroll">
  <div class="testata">
    <div class="testata-alto">
      <h1 class="titolo-sch">Lista</h1>
      <button type="button" class="utente" aria-label="Andrea: profilo e impostazioni"><span class="tondo"><span class="iniziale" aria-hidden="true">A</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="5.2" r="2.1" fill="#14163A"/><circle cx="12" cy="12" r="2.1" fill="#14163A"/><circle cx="12" cy="18.8" r="2.1" fill="#14163A"/></svg></button>
    </div>
    <span class="pill-sett">Settimana del 21 settembre</span>
  </div>
  <p class="stato-riga">Sei offline: la lista è quella dell'ultima apertura.</p>
  ${DATI.map(INVOLUCRI[k]).join('')}
  <div class="coda"></div>
</div>`}

const V=[
 {k:'w1',id:'1',nome:'Scheda bianca, tessere nude',
  p:'Il widget è una scheda bianca da 22 con bordo 1 e ombra; dentro, le tessere accese perdono il proprio fondo e restano tenute solo dal filo nel colore dell\'area. Una superficie per area invece di sei superfici per area: il raggruppamento si legge subito e il bianco non si ripete due volte.',
  m:'Scheda: raggio 22, bordo 1 px --bordo, ombra dei pannelli, padding 14 / 12 / 12, margine 0 12 12, gap interno 12. Dentro: intestazione di sezione, griglia 2 colonne gap 8, riga di controllo. Tessera accesa: fondo trasparente, bordo 1 px nel colore d\'area al 45%. Protagonista e spenta invariate.',
  r:'§8 involucro nuovo attorno alla sezione · §8 la tessera accesa perde il fondo bianco previsto'},

 {k:'w2',id:'2',nome:'Vassoio in tinta d\'area',
  p:'Nessun contenitore bianco: il widget è un vassoio nel colore dell\'area al 26%, la stessa tinta della riga di controllo. Le tessere bianche ci si appoggiano sopra. È la divisione più immediata di tutte — l\'area si riconosce da un metro e senza leggere — e la più colorata.',
  m:'Vassoio: raggio 22, fondo colore d\'area al 26%, nessun bordo, nessuna ombra, padding 14 / 12 / 12, margine 0 12 12, gap 12. Tessere invariate (bianca con filo al 45%, protagonista piena, spenta in --spento). La riga di controllo sta al 26% della sua stessa area, quindi dentro il vassoio della Dispensa si fonde col fondo: nella 2 andrebbe portata a bianco per restare distinguibile.',
  r:'§2.3 quinto uso del colore d\'area: fondo del contenitore di sezione · §8 involucro nuovo attorno alla sezione'},

 {k:'w3',id:'3',nome:'Scheda col cappello colorato',
  p:'Scheda bianca, ma l\'intestazione diventa una fascia piena nel colore dell\'area. Il colore si sposta dalla tessera protagonista alla testa del widget: così ogni sezione ha una sola macchia di colore, in cima, e tutte le tessere dentro sono pari — nessuna è più importante di un\'altra.',
  m:'Scheda: raggio 22, bordo 1, ombra dei pannelli, overflow nascosto. Cappello: padding 12 / 16, fondo pieno colore d\'area, etichetta mono 10 / 700 / 0,16em in --ink, contatore in rgba(20,22,58,0.55), senza quadratino (ridondante sul colore). Corpo: padding 12, gap 12. Tutte le tessere in bianco col filo al 45%: la protagonista perde la tinta e tiene solo il nome a 25.',
  r:'§2.3 quinto uso del colore d\'area: fascia d\'intestazione · §8 involucro nuovo · §8 la protagonista perde il fondo pieno, cioè la gerarchia dentro l\'area'},

 {k:'w4',id:'4',nome:'Widget senza scatola',
  p:'La versione più leggera: nessun contenitore, nessuna ombra. La sezione è delimitata da un filo a tutta larghezza sopra l\'intestazione e da 26 px d\'aria sotto. Divide bene e non aggiunge niente al sistema — ma "widget" resta un\'impressione, non un oggetto: se domani una sezione deve collassare o spostarsi, qui non c\'è nulla da prendere.',
  m:'Nessuna scheda. Filo 1 px --bordo sopra, padding-top 14, margine 0 12 26, gap 12. Intestazione, griglia e riga di controllo invariate rispetto alla variante E.',
  r:'nessuna regola nuova: usa solo bordo 1 px --bordo e la spaziatura 14 / 12 / 26'},

 {k:'w5',id:'5',nome:'Scheda con la protagonista a filo',
  p:'La scheda bianca tiene l\'intestazione in alto, poi la tessera protagonista entra a tutta larghezza, senza raggio e senza margine, come una fascia colorata dentro il widget; le altre tessere stanno sotto, nel padding. Il colore resta legato alla voce più importante e non all\'etichetta, e il widget guadagna una silhouette riconoscibile.',
  m:'Scheda: raggio 22, bordo 1, ombra dei pannelli, overflow nascosto. Testa: padding 12 / 16. Protagonista a filo: padding 13 / 16 / 15, raggio 0, larghezza piena, fondo pieno nel colore d\'area, nome 25. Corpo: padding 12, gap 12, griglia 2 colonne con le voci restanti.',
  r:'§8 involucro nuovo attorno alla sezione · §5 la protagonista a raggio 0, fuori dai cinque raggi'}
];

const c=document.getElementById('canvas');
V.forEach((v,i)=>{
  const el=document.createElement('div');
  el.className='frame';
  el.style.left=(60+i*453)+'px';el.style.top='60px';
  el.innerHTML=`<div class="intesta"><div class="sigla">Versione ${v.id} · ${v.nome}</div><p>${v.p}</p></div>
  <div class="tel" data-screen-label="Lista ${v.id}">${schermata(v.k)}${NAV}</div>
  <div class="note">
    <div class="sigla">Misure del widget</div>
    <p>${v.m}</p>
    <div class="sigla" style="margin-top:4px">Componenti usati</div>
    <div class="comp">Testata (titolo + menù utente) · Menù utente · Pillola settimana · Riga di stato · Etichetta di sezione · Tessera della Lista · Riga di controllo · Tab bar in pillola a due stati (versione 2: si abbassa e si stringe)</div>
    <div class="sigla" style="margin-top:4px">Regole di DESIGN.md che tocca</div>
    <div class="rompe">§12 gradiente di sfondo · §5 ombra nuova sui pannelli e sulla barra · §8 menù utente e tab bar in pillola · §7 lo scorrimento come gesto · ${v.r}</div>
  </div>`;
  c.appendChild(el);

  const tel=el.querySelector('.tel'), sc=el.querySelector('.scroll');
  let ultimo=0;
  sc.addEventListener('scroll',()=>{
    const y=sc.scrollTop;
    if(y<=4){tel.classList.remove('giu');ultimo=y;return}
    if(Math.abs(y-ultimo)<8)return;
    tel.classList.toggle('giu',y>ultimo);
    ultimo=y;
  },{passive:true});
});
</script>
</body>
</html>
