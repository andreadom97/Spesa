<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>Dispensa — 5 versioni</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--fondo:#F1F0EE;--superficie:#FFFFFF;--ink:#14163A;--ink-2:#3D4166;--testo-2:#5C5F7A;--sec:#8A8A96;--ter:#A6A6B2;--off:#9A9AA6;
--bordo:rgba(20,22,58,0.07);--spento:rgba(20,22,58,0.035);--icona-spenta:#C4C4CE;--bordo-tratteggio:rgba(20,22,58,0.20);
--avviso:#9A5C00;--errore:#C4423E;--freddo:#2F6FBF;
--area-ortofrutta:#A8D96A;--area-macelleria:#F29B9B;--area-latticini:#9CC7F2;--area-cereali:#F5CE5B;--area-dispensa:#F2A465;--area-surgelati:#B9AEF5;
--font-testo:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
--ombra-pannello:0 1px 2px rgba(20,22,58,.05),0 6px 16px rgba(20,22,58,.06);
--ombra-nav:0 2px 6px rgba(20,22,58,.08),0 12px 30px rgba(20,22,58,.16);
--moto-barra:200ms;--curva-barra:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box}
body{margin:0;background:#D8D7D4;font-family:var(--font-testo);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--ink)}a:hover{color:var(--ink-2)}
.frame{position:absolute;width:393px}
.sigla{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.intesta{display:flex;flex-direction:column;gap:6px;padding:0 2px 12px}
.intesta p{margin:0;font-size:12.5px;line-height:1.4;color:#3D4166}

.tel{width:393px;height:852px;border-radius:26px;overflow:hidden;position:relative;box-shadow:0 2px 4px rgba(20,22,58,.10),0 18px 40px rgba(20,22,58,.18);background:linear-gradient(180deg,#EDECEA 0%,#F2F1EF 34%,#F8F8F7 70%,#FCFCFB 100%);--fine:128px}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - var(--fine)),rgba(0,0,0,.55) calc(100% - 74px),rgba(0,0,0,0) calc(100% - 30px));
mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - var(--fine)),rgba(0,0,0,.55) calc(100% - 74px),rgba(0,0,0,0) calc(100% - 30px))}
.scroll::-webkit-scrollbar{width:0}

.testata{padding:20px 18px 12px;display:flex;flex-direction:column;gap:15px}
.testata-alto{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.titolo-sch{font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1;margin:0}
.utente{height:50px;display:flex;align-items:center;gap:5px;margin:0 -2px -3px 0;background:rgba(20,22,58,.07);border:0;border-radius:999px;padding:0 12px 0 6px}
.utente .tondo{width:38px;height:38px;border-radius:999px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.iniziale{font-family:var(--font-mono);font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:#fff}

.colonna{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.campo{height:44px;border-radius:14px;background:#fff;border:1px solid var(--bordo);box-shadow:var(--ombra-pannello);display:flex;align-items:center;gap:9px;padding:0 14px}
.campo input{flex:1;min-width:0;border:0;outline:0;background:none;font-family:var(--font-testo);font-size:14px;color:var(--ink)}
.campo input::placeholder{color:var(--testo-2)}
.agg{width:100%;height:56px;border-radius:14px;border:2px dashed var(--bordo-tratteggio);background:none;display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.stato-riga{font-size:12.5px;line-height:1.4;color:var(--testo-2);padding:0 16px 10px;margin:0}

.w{margin:0 16px;background:#fff;border:1px solid var(--bordo);border-radius:22px;box-shadow:var(--ombra-pannello);padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px}
.w-testa{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.w-lb{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.quad{width:10px;height:10px;border-radius:4px;flex:none}
.w-cont{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.10em;text-transform:uppercase;color:var(--sec)}
.w-nota{font-size:12.5px;line-height:1.4;color:var(--testo-2);padding:0 4px;margin:0}
.righe{display:flex;flex-direction:column;gap:6px}

/* riga di dispensa */
.rd{display:flex;align-items:center;border-radius:14px;background:none;border:0;padding:0;min-height:68px;text-align:left;font:inherit;color:inherit;width:100%}
.rd.bianca{background:#fff;border:1px solid rgba(20,22,58,.09);box-shadow:var(--ombra-pannello)}
.rd.fuori{background:var(--spento)}
.rd-corpo{flex:1;min-width:0;padding:12px 8px 12px 14px;display:flex;flex-direction:column;gap:3px}
.rd-nome{font-size:17px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-nome.barrato{text-decoration:line-through;text-decoration-thickness:1.6px;color:rgba(20,22,58,.34)}
.rd-sub{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ter)}
.rd-sub.info{color:var(--testo-2);font-weight:700}
.rd-sub.avviso{color:var(--avviso);font-weight:700}
.rd-sub.gelo{color:var(--freddo);font-weight:700}
.rd-qta{flex:none;display:flex;align-items:baseline;gap:4px;padding:0 10px 0 0}
.rd-num{font-family:var(--font-mono);font-size:14px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.rd-un{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ter)}
.luce{width:44px;flex:none;align-self:stretch;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0}
.bulbo{width:26px;height:26px;border-radius:999px;flex:none}
.bulbo.acceso{background:var(--ink);box-shadow:0 1px 3px rgba(20,22,58,.28)}
.bulbo.spento{background:none;border:2px solid rgba(20,22,58,.22)}
.freddo{font-family:var(--font-mono);font-size:8.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--freddo)}

/* tessera di dispensa */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.td{min-height:104px;border-radius:14px;background:#fff;box-shadow:var(--ombra-pannello);padding:12px 14px 13px;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;border:1px solid transparent}
.td.spenta{background:var(--spento);box-shadow:none}
.td-alto{display:flex;align-items:center;gap:6px}
.td-pil{font-family:var(--font-mono);font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:5px 10px}
.td-nome{font-size:17px;font-weight:700;letter-spacing:-.032em;line-height:1.1;margin-top:auto}
.td-sub{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--ter);margin-top:5px}

/* barra di livello */
.liv{height:6px;border-radius:999px;background:rgba(20,22,58,.08);overflow:hidden;margin-top:8px}
.liv i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.coda{height:140px}

.nav{position:absolute;left:16px;right:16px;bottom:22px;height:84px;border-radius:999px;display:flex;align-items:center;gap:2px;padding:6px;background:#fff;box-shadow:var(--ombra-nav)}
.nav .voce{flex:1;height:72px;border:0;background:none;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;overflow:hidden}
.nav .voce.on{background:rgba(20,22,58,.07)}
.nav .segno{display:flex;align-items:center;justify-content:center;flex:none;height:26px}
.nav .lb{font-family:var(--font-mono);font-size:8.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--off);white-space:nowrap;max-height:12px;opacity:1;line-height:1}
.nav .voce.on .lb{color:var(--ink);font-weight:700}
.marchio{display:grid;gap:4px}
.cas{border-radius:2.52px;border:2px solid transparent}
.tel.giu .nav{height:66px;left:46px;right:46px}
.tel.giu .nav .voce{height:54px;gap:0}
.tel.giu .nav .lb{max-height:0;opacity:0}
.tel.giu{--fine:110px}
@media (prefers-reduced-motion: no-preference){
  .nav,.nav .voce,.nav .lb{transition:height var(--moto-barra) var(--curva-barra),max-height var(--moto-barra) var(--curva-barra),opacity 150ms linear,gap var(--moto-barra) var(--curva-barra),left var(--moto-barra) var(--curva-barra),right var(--moto-barra) var(--curva-barra)}
}

.note{width:393px;margin-top:12px;background:#fff;border:1px solid var(--bordo);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.note p{margin:0;font-size:12.5px;line-height:1.45;color:var(--testo-2)}
.note strong{color:var(--ink)}
.comp{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--sec);line-height:1.7}
.rompe{font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#9A5C00;line-height:1.6}
</style>
</head>
<body>
<div id="canvas"></div>
<script>
const A={orto:'#A8D96A',mac:'#F29B9B',lat:'#9CC7F2',cer:'#F5CE5B',dis:'#F2A465',sur:'#B9AEF5'};
const ORD=[[A.dis,1],[A.lat,1],[A.orto,0],[A.sur,1],[A.cer,1],[A.mac,0]];
const AREE=[
 {k:'orto',lb:'Ortofrutta',c:A.orto},{k:'mac',lb:'Macelleria e pescheria',c:A.mac},
 {k:'lat',lb:'Latticini, uova e salumi',c:A.lat},{k:'cer',lb:'Pasta, riso e cereali',c:A.cer},
 {k:'dis',lb:'Dispensa e conserve',c:A.dis},{k:'sur',lb:'Surgelati',c:A.sur}];

/* in casa: q = quantità attuale, base = quanto ne tieni di solito, scad = data, gelo = congelato */
const D=[
 {nome:'Passata di pomodoro',area:'dis',q:1500,un:'g',base:2000,casa:true},
 {nome:'Olio extravergine',area:'dis',q:750,un:'ml',base:1000,casa:true},
 {nome:'Fagioli cannellini',area:'dis',q:2,un:'conf',base:4,casa:true},
 {nome:'Tonno sott\'olio',area:'dis',q:0,un:'conf',base:3,casa:false},
 {nome:'Spaghetti n. 5',area:'cer',q:1200,un:'g',base:1500,casa:true},
 {nome:'Riso carnaroli',area:'cer',q:400,un:'g',base:1000,casa:true},
 {nome:'Farro perlato',area:'cer',q:0,un:'g',base:500,casa:false},
 {nome:'Parmigiano',area:'lat',q:220,un:'g',base:300,casa:true,scad:'22/09/2026'},
 {nome:'Ricotta',area:'lat',q:250,un:'g',base:250,casa:true,scad:'19/09/2026'},
 {nome:'Uova medie',area:'lat',q:4,un:'pz',base:12,casa:true},
 {nome:'Zucchine',area:'orto',q:600,un:'g',base:800,casa:true},
 {nome:'Limoni',area:'orto',q:2,un:'pz',base:4,casa:true},
 {nome:'Spinaci',area:'orto',q:0,un:'g',base:500,casa:false},
 {nome:'Petto di pollo',area:'mac',q:600,un:'g',base:600,casa:true,gelo:true},
 {nome:'Guanciale',area:'mac',q:0,un:'g',base:150,casa:false},
 {nome:'Piselli',area:'sur',q:1000,un:'g',base:1000,casa:true,gelo:true},
 {nome:'Minestrone pronto',area:'sur',q:2,un:'conf',base:2,casa:true,gelo:true}
];
const plur=(n,s,p)=>`${n} ${n===1?s:p}`;
const inCasa=D.filter(d=>d.casa), fuori=D.filter(d=>!d.casa);
const scadenze=inCasa.filter(d=>d.scad);
const scarsi=inCasa.filter(d=>d.q/d.base<0.5);
const perArea=k=>D.filter(d=>d.area===k);
const liv=d=>Math.min(100,Math.round(d.q/d.base*100));
const qta=d=>`${d.q} ${d.un}`;

const CHEV=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke="#C4C4CE" stroke-width="2.1" stroke-linecap="round"/></svg>`;
const LENTE=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.6" stroke="#8A8A96" stroke-width="2.1"/><path d="M15.4 15.4 20 20" stroke="#8A8A96" stroke-width="2.1" stroke-linecap="round"/></svg>`;
const PIU=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#14163A" stroke-width="2.1" stroke-linecap="round"/></svg>`;
const SPUNTA=c=>``;

/* riga di dispensa: la luce a destra dice a casa / fuori */
function rd(d,opz){const o=opz||{};
 const sub=d.casa?(d.scad?`Scade il ${d.scad}`:(d.gelo?'Congelato':`Di solito ne tieni ${d.base} ${d.un}`)):'Fuori casa';
 const cls=d.scad?'avviso':(d.casa?(d.gelo?'gelo':'info'):'info');
 return `<div class="rd ${o.bianca?'bianca':''} ${d.casa?'':'fuori'}">
  <button type="button" class="rd-corpo" aria-label="Apri ${d.nome}" style="border:0;background:none;text-align:left;font:inherit;color:inherit">
    <span class="rd-nome ${d.casa?'':'barrato'}">${d.nome}</span>
    <span class="rd-sub ${cls}">${sub}</span>
  </button>
  ${d.casa?`<span class="rd-qta"><span class="rd-num">${d.q}</span><span class="rd-un">${d.un}</span></span>`:''}
  <button type="button" class="luce" aria-pressed="${d.casa}" aria-label="${d.nome}: ${d.casa?'a casa, tocca per segnare finito':'finito, tocca per segnare a casa'}"><span class="bulbo ${d.casa?'acceso':'spento'}"></span></button>
</div>`}

function td(d){return `<button type="button" class="td ${d.casa?'':'spenta'}" aria-pressed="${d.casa}" aria-label="${d.nome}: ${d.casa?qta(d)+' in casa, tocca per segnare finito':'finito, tocca per segnare a casa'}">
  <span class="td-alto"><span class="td-pil" style="${d.casa?'background:rgba(20,22,58,.06);color:var(--ink)':'background:rgba(20,22,58,.06);color:rgba(20,22,58,.34)'}">${qta(d)}</span>${d.gelo?'<span class="freddo">Congelato</span>':''}</span>
  <span class="td-nome ${d.casa?'':'barrato'}">${d.nome}</span>
  ${d.casa?`<span class="liv" aria-hidden="true"><i style="width:${liv(d)}%"></i></span>`:'<span class="td-sub">Fuori casa</span>'}</button>`}

function testata(){return `<div class="testata">
  <div class="testata-alto">
    <h1 class="titolo-sch">Dispensa</h1>
    <button type="button" class="utente" aria-label="Andrea: profilo e impostazioni"><span class="tondo"><span class="iniziale" aria-hidden="true">A</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="5.2" r="2.1" fill="#14163A"/><circle cx="12" cy="12" r="2.1" fill="#14163A"/><circle cx="12" cy="18.8" r="2.1" fill="#14163A"/></svg></button>
  </div>
</div>`}
const CAMPO=`<div class="campo">${LENTE}<input type="search" aria-label="Cerca in dispensa" placeholder="Cerca in dispensa"></div>`;
const AGG=`<button type="button" class="agg">${PIU}Aggiungi in dispensa</button>`;

function marchio(l){return `<span class="marchio" style="grid-template-columns:repeat(3,${l}px);grid-auto-rows:${l}px" aria-hidden="true">${ORD.map(([c,p])=>`<span class="cas" style="border-color:${c};background:${p?c:'transparent'}"></span>`).join('')}</span>`}
const IC={
 piano:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15.5" rx="4.4" fill="#9A9AA6"/><rect x="6.2" y="8.4" width="11.6" height="2.1" rx="1.05" fill="#fff" opacity=".92"/><circle cx="8.2" cy="14.6" r="1.7" fill="#fff" opacity=".92"/><circle cx="12" cy="14.6" r="1.7" fill="#fff" opacity=".92"/><circle cx="15.8" cy="14.6" r="1.7" fill="#fff" opacity=".92"/></svg>`,
 piatti:s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#9A9AA6"/><circle cx="12" cy="12" r="4.1" fill="#fff" opacity=".92"/></svg>`,
 dispensa:(s,c)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3.4" width="14" height="3.6" rx="1.8" fill="${c}"/><path d="M6 9.4h12a1 1 0 0 1 1 1v6.4a3.2 3.2 0 0 1-3.2 3.2H8.2A3.2 3.2 0 0 1 5 16.8v-6.4a1 1 0 0 1 1-1Z" fill="${c}"/><rect x="8.4" y="12.4" width="7.2" height="2.1" rx="1.05" fill="#fff" opacity=".92"/></svg>`};
const NAV=`<nav class="nav" aria-label="Sezioni">
  <button type="button" class="voce" aria-pressed="false" aria-label="Lista"><span class="segno">${marchio(9)}</span><span class="lb">Lista</span></button>
  <button type="button" class="voce" aria-pressed="false" aria-label="Piano"><span class="segno">${IC.piano(26)}</span><span class="lb">Piano</span></button>
  <button type="button" class="voce" aria-pressed="false" aria-label="Piatti"><span class="segno">${IC.piatti(26)}</span><span class="lb">Piatti</span></button>
  <button type="button" class="voce on" aria-pressed="true" aria-label="Dispensa"><span class="segno">${IC.dispensa(26,'#14163A')}</span><span class="lb">Dispensa</span></button>
</nav>`;

const CORPI={
 v1:()=>`<div class="colonna">${CAMPO}${AGG}${D.map(d=>rd(d,{bianca:true})).join('')}</div>`,

 v2:()=>`<div class="colonna">${CAMPO}</div><div style="height:12px"></div>${AREE.map(a=>{const v=perArea(a.k);return `<section class="w" style="margin-bottom:12px"><div class="w-testa"><span class="w-lb"><span class="quad" style="background:${a.c}"></span>${a.lb}</span><span class="w-cont">${plur(v.filter(d=>d.casa).length,'voce','voci')} in casa</span></div><div class="righe">${v.map(d=>rd(d)).join('')}</div></section>`}).join('')}<div class="colonna">${AGG}</div>`,

 v3:()=>`<div class="colonna">${CAMPO}</div><div style="height:12px"></div>${AREE.map(a=>{const v=perArea(a.k);return `<section class="w" style="margin-bottom:12px"><div class="w-testa"><span class="w-lb"><span class="quad" style="background:${a.c}"></span>${a.lb}</span><span class="w-cont">${plur(v.filter(d=>d.casa).length,'voce','voci')} in casa</span></div><div class="grid">${v.map(td).join('')}</div></section>`}).join('')}<div class="colonna">${AGG}</div>`,

 v4:()=>`${[
   {lb:'Scade entro una settimana',nota:'Due voci hanno una data che hai inserito tu.',v:scadenze},
   {lb:'Ne è rimasto poco',nota:'Meno della metà di quanto ne tieni di solito.',v:scarsi.filter(d=>!d.scad)},   {lb:'Finito',nota:'Voci che hai segnato finite: entrano in Lista al prossimo ricalcolo.',v:fuori},
   {lb:'Tutto il resto',nota:'Voci in casa senza scadenza e con almeno metà della scorta.',v:inCasa.filter(d=>!d.scad&&d.q/d.base>=0.5)}
  ].map(s=>`<section class="w" style="margin-bottom:12px"><div class="w-testa"><span class="w-lb">${s.lb}</span><span class="w-cont">${plur(s.v.length,'voce','voci')}</span></div><p class="w-nota">${s.nota}</p><div class="righe">${s.v.map(d=>rd(d)).join('')}</div></section>`).join('')}<div class="colonna">${AGG}</div>`,

 v5:()=>`<p class="stato-riga">Segnato finito l'ultima volta il 16/09/2026.</p><div class="colonna">${CAMPO}${AGG}</div><div style="height:12px"></div>${AREE.map(a=>{const v=perArea(a.k);return `<section class="w" style="margin-bottom:12px"><div class="w-testa"><span class="w-lb"><span class="quad" style="background:${a.c}"></span>${a.lb}</span><span class="w-cont">${plur(v.filter(d=>d.casa).length,'voce','voci')} in casa</span></div><div class="righe">${v.filter(d=>d.casa).map(d=>rd(d)).join('')}</div>${v.some(d=>!d.casa)?`<p class="w-nota">Finito: ${v.filter(d=>!d.casa).map(d=>d.nome).join(', ')}.</p>`:''}</section>`}).join('')}`
};

const V=[
 {k:'v1',id:'1',nome:'Elenco unico, come Piatti',

  m:'Colonna a 16, gap 8. Riga di dispensa: minimo 68, raggio 14, bianca con bordo 1 px rgba(20,22,58,0.09) e ombra dei pannelli; corpo (nome 17 / 700 troncato + sottoriga mono 9), quantità in mono 14 / 700 tabular-nums con unità in mono 10, luce 44 a destra. Voce finita: fondo --spento, nome barrato, nessuna quantità.',

 {k:'v2',id:'2',nome:'Un widget per area',

  m:'Sei widget, raggio 22, bordo 1, ombra dei pannelli, padding 14 / 12 / 12, margine 0 16 12. Intestazione: quadratino 10 × 10 raggio 4 nel colore dell\'area, etichetta mono 10 / 700 / 0,16em, contatore mono 10 / 500. Righe nude dentro, minimo 68, gap 6.',

  m:'Griglia 2 colonne, gap 8, tessera minimo 104, raggio 14, ombra dei pannelli. Dentro: pillola della quantità in mono 10,5, nome 17 / 700 in basso, barra del livello alta 6 raggio 999 su fondo rgba(20,22,58,0.08) con riempimento in --ink. Tessera finita: fondo --spento, nome barrato, nessuna barra.',

 {k:'v4',id:'4',nome:'Ordinata per cosa richiede attenzione',

const c=document.getElementById('canvas');
V.forEach((v,i)=>{
  const el=document.createElement('div');
  el.className='frame';
  el.style.left=(60+i*453)+'px';el.style.top='60px';
  el.innerHTML=`<div class="intesta"><div class="sigla">Versione ${v.id} · ${v.nome}</div><p>${v.p}</p></div>

    <div class="sigla">Misure</div>
    <p>${v.m}</p>
    <div class="sigla" style="margin-top:4px">Componente nuovo</div>
    <p><strong>COMPONENTE NUOVO: Riga di dispensa.</strong> Anatomia da sinistra: corpo (nome <strong>17 / 700 / -0,03em</strong> troncato, sottoriga mono <strong>9</strong>), quantità in mono <strong>14 / 700</strong> con <code>tabular-nums</code> e unità in mono 10, e a destra una zona <strong>44 × 68</strong> con la <strong>luce</strong> dello stato: un disco da <strong>26</strong>, <strong>pieno</strong> in --ink quando la voce è in casa, <strong>contornato</strong> 2 px in rgba(20,22,58,0.22) e vuoto quando è finita. Niente spunta e niente casella: pieno contro contornato è la stessa grammatica del Marchio e della casetta della Riga pasto, come vuole il principio 3 (“lo stato è una luce, non una casella”). Lo stato porta anche una seconda forma, il nome barrato, quindi non dipende dal solo colore. Due bersagli: il corpo apre la voce, la luce cambia lo stato, come vuole §9 (“cambiare stato ha sempre un controllo suo”). Nessun componente esistente bastava: la Tessera della Lista è l\'interruttore di sé stessa e vive in griglia, la Riga pasto ha la casetta da 60 e nessuna quantità.</p>

    <p>Le voci congelate lo dicono nella sottoriga, in <strong>--freddo #2F6FBF</strong> a peso 700 — 5,1:1 su bianco — il token che §2.2 riserva esattamente a questo. Non va in --ter con gli altri metadati: è informazione, e §2.1 vuole almeno 4,5:1 su ogni testo che informa.</p>
    <div class="sigla" style="margin-top:4px">La sottoriga ha quattro ruoli</div>
