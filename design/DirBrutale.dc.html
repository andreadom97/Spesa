<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #000000; } a:hover { background: #000000; color: #FFFFFF; }
    * { box-sizing: border-box; }
    button { font-family: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
    .sc::-webkit-scrollbar { width: 0; }
  </style>
</helmet>
<div style="width: 393px; height: 852px; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF;">

  <div style="padding: 26px 18px 0;">
    <div style="font-family: 'Anton', 'Archivo', sans-serif; font-size: 62px; line-height: 0.84; letter-spacing: -0.015em; color: #000000; text-transform: uppercase;">Spesa</div>
    <div style="display: flex; justify-content: space-between; padding: 14px 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #000000;">
      <span>31 AGO — 6 SET</span>
      <span>OFFLINE / 3</span>
    </div>
  </div>
  <div style="height: 4px; background: #000000;"></div>

  <div class="sc" style="flex: 1; overflow-y: auto;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <div>
        <div style="background: #000000; padding: 9px 18px; display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-family: 'Anton', 'Archivo', sans-serif; font-size: 15px; letter-spacing: 0.13em; color: #FFFFFF; text-transform: uppercase;">{{sec.rep}}</span>
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.13em; color: #FFFFFF;">{{sec.n}}</span>
        </div>
        <sc-for list="{{sec.items}}" as="item" hint-placeholder-count="3">
          <button onClick="{{item.toggle}}" style="{{item.rowStyle}}">
            <div style="{{item.boxStyle}}">
              <sc-if value="{{item.done}}" hint-placeholder-val="{{true}}">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 10.5 L8 14.4 L16 5.8" stroke="#000000" stroke-width="3" stroke-linecap="square"/></svg>
              </sc-if>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="{{item.nameStyle}}">{{item.nome}}</div>
              <sc-if value="{{item.showSub}}" hint-placeholder-val="{{true}}">
                <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #6E6E6E; margin-top: 4px;">{{item.sub}}</div>
              </sc-if>
            </div>
            <div style="{{item.confStyle}}">{{item.conf}}<br><span style="font-weight: 500; font-size: 11px;">{{item.qty}}</span></div>
          </button>
        </sc-for>
        <sc-for list="{{sec.controls}}" as="ctl" hint-placeholder-count="1">
          <div style="background: #000000; padding: 18px; display: flex; align-items: center; gap: 14px; border-bottom: 3px solid #000000;">
            <div style="flex: 1; min-width: 0;">
              <div style="font-family: 'Anton', 'Archivo', sans-serif; font-size: 22px; line-height: 1.05; letter-spacing: 0.01em; color: #FFFFFF; text-transform: uppercase;">{{ctl.nome}}</div>
              <div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.13em; color: #8A8A8A; margin-top: 5px;">{{ctl.hint}}</div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button onClick="{{ctl.yes}}" style="{{ctl.yesStyle}}">SÌ</button>
              <button onClick="{{ctl.no}}" style="{{ctl.noStyle}}">NO</button>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="height: 4px; background: #000000;"></div>
  <div style="padding: 14px 18px 20px;">
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 13px;">
      <span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.14em; color: #000000;">{{progressLabel}}</span>
      <div style="flex: 1; height: 10px; border: 2px solid #000000;"><div style="{{progressBar}}"></div></div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button onClick="{{goBase}}" style="{{baseTabStyle}}">BASE / {{baseCount}}</button>
      <button onClick="{{goTopup}}" style="{{topupTabStyle}}">TOP-UP / {{topupCount}}</button>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'base', done: { tonno: true, ceci: true }, ctl: {} }; }
  data() {
    return {
      base: [
        { rep: 'PASTA E CEREALI', items: [
          { id: 'riso', nome: 'Riso Carnaroli', conf: '1 CONF', qty: '1000 G', sub: 'IN CASA 0 G' },
          { id: 'avena', nome: "Fiocchi d'avena", conf: '1 CONF', qty: '500 G', sub: 'IN CASA 90 G' },
          { id: 'pasta', nome: 'Pasta integrale', conf: '2 CONF', qty: '1000 G', sub: '' }
        ], controls: [] },
        { rep: 'SCATOLAME', items: [
          { id: 'tonno', nome: 'Tonno al naturale', conf: '3 CONF', qty: '240 G', sub: '' },
          { id: 'ceci', nome: 'Ceci lessati', conf: '2 CONF', qty: '800 G', sub: '' },
          { id: 'passata', nome: 'Passata di pomodoro', conf: '1 CONF', qty: '700 G', sub: '' }
        ], controls: [ { id: 'olio', nome: 'Olio: ne hai ancora?', hint: 'ULTIMO ACQUISTO 54 GIORNI FA' } ] },
        { rep: 'BEVANDE', items: [
          { id: 'caffe', nome: 'Caffè macinato', conf: '1 CONF', qty: '250 G', sub: '' }
        ], controls: [] }
      ],
      topup: [
        { rep: 'LATTICINI E UOVA', items: [
          { id: 'yogurt', nome: 'Yogurt greco', conf: '2 CONF', qty: '1000 G', sub: 'IN CASA 50 G' },
          { id: 'uova', nome: 'Uova', conf: '6 PZ', qty: '6 PZ', sub: '' }
        ], controls: [] },
        { rep: 'MACELLERIA', items: [
          { id: 'pollo', nome: 'Petto di pollo', conf: '1 CONF', qty: '700 G', sub: 'IN CASA 0 G' },
          { id: 'salmone', nome: 'Salmone', conf: '2 CONF', qty: '300 G', sub: '' }
        ], controls: [] },
        { rep: 'ORTOFRUTTA', items: [
          { id: 'spinaci', nome: 'Spinaci', conf: '2 CONF', qty: '400 G', sub: '' },
          { id: 'mele', nome: 'Mele', conf: '6 PZ', qty: '6 PZ', sub: '' }
        ], controls: [] }
      ]
    };
  }
  countOf(secs) { var n = 0; for (var i = 0; i < secs.length; i++) { n += secs[i].items.length; } return n; }
  renderVals() {
    var self = this;
    var d = this.data();
    var secs = (this.state.tab === 'base') ? d.base : d.topup;
    var total = 0, done = 0;
    var sections = secs.map(function (s) {
      var items = s.items.map(function (it) {
        var k = !!self.state.done[it.id];
        total += 1; if (k) { done += 1; }
        return {
          nome: it.nome, conf: it.conf, qty: it.qty, sub: it.sub, done: k, showSub: !!it.sub && !k,
          rowStyle: 'width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 2px solid #000000; background: ' + (k ? '#000000' : '#FFFFFF') + ';',
          boxStyle: 'width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; border: 3px solid ' + (k ? '#FFFFFF' : '#000000') + '; background: ' + (k ? '#FFFFFF' : 'transparent') + ';',
          nameStyle: 'font-size: 23px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.05; color: ' + (k ? '#FFFFFF' : '#000000') + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;' + (k ? ' text-decoration: line-through; text-decoration-thickness: 2px;' : ''),
          confStyle: 'text-align: right; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.35; color: ' + (k ? '#FFFFFF' : '#000000') + ';',
          toggle: function () { var n = Object.assign({}, self.state.done); if (n[it.id]) { delete n[it.id]; } else { n[it.id] = true; } self.setState({ done: n }); }
        };
      });
      var controls = (s.controls || []).map(function (c) {
        var a = self.state.ctl[c.id] || null;
        var b = 'min-width: 58px; height: 48px; padding: 0 14px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; border: 3px solid #FFFFFF;';
        return {
          nome: c.nome, hint: c.hint,
          yesStyle: b + (a === 'si' ? ' background: #FFFFFF; color: #000000;' : ' background: #000000; color: #FFFFFF;'),
          noStyle: b + (a === 'no' ? ' background: #FFFFFF; color: #000000;' : ' background: #000000; color: #FFFFFF;'),
          yes: function () { var x = Object.assign({}, self.state.ctl); x[c.id] = 'si'; self.setState({ ctl: x }); },
          no: function () { var x = Object.assign({}, self.state.ctl); x[c.id] = 'no'; self.setState({ ctl: x }); }
        };
      });
      return { rep: s.rep, n: s.items.length, items: items, controls: controls };
    });
    var pct = total ? Math.round((done / total) * 100) : 0;
    var tOn = 'flex: 1; height: 50px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.11em; background: #000000; color: #FFFFFF; border: 3px solid #000000;';
    var tOff = 'flex: 1; height: 50px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.11em; background: #FFFFFF; color: #000000; border: 3px solid #000000;';
    return {
      sections: sections,
      baseCount: this.countOf(d.base), topupCount: this.countOf(d.topup),
      progressLabel: done + '/' + total,
      progressBar: 'height: 100%; width: ' + pct + '%; background: #000000;',
      baseTabStyle: this.state.tab === 'base' ? tOn : tOff,
      topupTabStyle: this.state.tab === 'topup' ? tOn : tOff,
      goBase: function () { self.setState({ tab: 'base' }); },
      goTopup: function () { self.setState({ tab: 'topup' }); }
    };
  }
}
</script>
</body>
</html>
